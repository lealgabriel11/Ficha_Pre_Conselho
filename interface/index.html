<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha do Pré Conselho - IFPI Campus Angical</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    
</head>
<body>
    
      <form class="max-w-150 md:max-w-180 mx-auto  my-4 bg-white p-11 rounded-lg shadow-lg border-t-5  border-t-green-500">

        <h1 class="text-3xl font-bold my-1  ">
            Ficha do Pré Conselho
        </h1>

        <div class="flex flex-wrap -mx-3 mb-6">


          <div class="w-full md:w-1/2 px-3 mb-6 md:mb-0">

            <label class="block uppercase tracking-wide text-gray-700 text-xs font-bold mb-2" for="grid-first-name">
              Turma
            </label>
            
            <input class="appearance-none block w-full bg-gray-200 text-gray-700  border-gray-200 border rounded py-3 px-4 mb-3 leading-tight focus:outline-none focus:bg-white" id="grid-first-name" type="text" placeholder="Identificação da turma">

          </div>

          <div class="w-full md:w-1/2 px-3">
            <label class="block uppercase tracking-wide text-gray-700 text-xs font-bold mb-2" for="grid-last-name">
              Líderes
            </label>
            <input class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 leading-tight focus:outline-none focus:bg-white " id="grid-last-name" type="text" placeholder="Nome dos Líderes">
          </div>
        </div>
        
      </form>

      <form class="max-w-150 md:max-w-180 mx-auto rounded-b-none -my-1    bg-white py-7 px-11 rounded-lg shadow-lg">
        
        <h2 class="mb-6 text-center text-3xl font-bold text-gray-800">Tópico: Ensino</h2>

        <fieldset>
          <legend class="mb-4 text-lg font-bold text-gray-800">
            O método de ensino é agradável?
          </legend>

          <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3">
            <label for="q1" class="flex cursor-pointer items-center gap-3 rounded-lg border border-gray-200 bg-slate-50 p-4 transition hover:border-green-500 hover:bg-green-50">
              <input class="h-4 w-4 accent-green-600" type="radio" name="metodo_ensino" id="q1" value="muito_agradavel">
              <span>Muito agradável</span>
            </label>

            <label for="q2" class="flex cursor-pointer items-center gap-3 rounded-lg border border-gray-200 bg-slate-50 p-4 transition hover:border-green-500 hover:bg-green-50">
              <input class="h-4 w-4 accent-green-600" type="radio" name="metodo_ensino" id="q2" value="agradavel">
              <span>Agradável</span>
            </label>

            <label for="q3" class="flex cursor-pointer items-center gap-3 rounded-lg border border-gray-200 bg-slate-50 p-4 transition hover:border-green-500 hover:bg-green-50">
              <input class="h-4 w-4 accent-green-600" type="radio" name="metodo_ensino" id="q3" value="regular">
              <span>Regular</span>
            </label>

            <label for="q4" class="flex cursor-pointer items-center gap-3 rounded-lg border border-gray-200 bg-slate-50 p-4 transition hover:border-green-500 hover:bg-green-50">
              <input class="h-4 w-4 accent-green-600" type="radio" name="metodo_ensino" id="q4" value="desagradavel">
              <span>Desagradável</span>
            </label>

            <label for="q5" class="flex cursor-pointer items-center gap-3 rounded-lg border border-gray-200 bg-slate-50 p-4 transition hover:border-green-500 hover:bg-green-50">
              <input class="h-4 w-4 accent-green-600" type="radio" name="metodo_ensino" id="q5" value="nao_se_aplica">
              <span>Não se aplica</span>
            </label>
          </div>

          <div class="mt-6 w-full">
            <label class="mb-2 block text-xs font-bold uppercase tracking-wide text-gray-700" for="adc1">
              Observação complementar
            </label>
            <textarea name="complemento" id="adc1" class="block min-h-24 w-full min-w-0 resize-y rounded border border-gray-300 bg-slate-100 p-3 text-gray-700  focus:outline-none focus:bg-white" rows="3" placeholder="Escreva uma observação, se necessário"></textarea>
          </div>
        </fieldset>

      </form>

        <footer class="flex justify-end md:max-w-180  max-w-150 mx-auto bg-white py-4 px-11 rounded-lg   shadow-lg">

          <button class="bg-green-500 rounded cursor-pointer px-2 py-1 my-1 shadow-sm  hover:bg-green-700 border-t-gray-950 border border-r-gray-950 hover:translate-x-0.5 border-emerald-600 hover:border-green-800" type="button" id="b1"><span>Proximo</span></button>

        </footer>
        <script src="scripts.js"></script>
</body>

</html>
