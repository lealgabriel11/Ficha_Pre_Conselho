<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha do Pré Conselho - IFPI Campus Angical</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
</head>
<body>
    
      <form class="max-w-150 mx-auto  my-3 bg-white p-11 rounded-lg shadow-lg border-t-5 border-t-green-500">

        <h1 class="text-3xl font-bold underline ">
            Ficha do Pré Conselho
        </h1>

        <div class="flex flex-wrap -mx-3 mb-6">


          <div class="w-full md:w-1/2 px-3 mb-6 md:mb-0">

            <label class="block uppercase tracking-wide text-gray-700 text-xs font-bold mb-2" for="grid-first-name">
              Turma
            </label>
            
            <input class="appearance-none block w-full bg-gray-200 text-gray-700  border-gray-200 border rounded py-3 px-4 mb-3 leading-tight focus:outline-none focus:bg-white" id="grid-first-name" type="text" placeholder="Identificação da turma">

          </div>

          <div class="w-full md:w-1/2 px-3">
            <label class="block uppercase tracking-wide text-gray-700 text-xs font-bold mb-2" for="grid-last-name">
              Líderes
            </label>
            <input class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 leading-tight focus:outline-none focus:bg-white focus:border-gray-500" id="grid-last-name" type="text" placeholder="Nome dos Líderes">
          </div>
        </div>
        
      </form>

      <form class=" max-w-150 mx-auto bg-white py-11 px-11 rounded-lg  shadow-lg">

            <h2 class="flex text-2xl py-2 font-bold justify-center  "> topico 1 </h2 >




            <div class="grid grid-cols-3    gap-y-8 gap-x-4">

              <div class="w-full py-7">
                <input class="a" type="checkbox" name="Questao1" id="q1">
                <label for="q1">alguma pergunta 1</label>
              </div>

              <div class="w-full py-7">
                <input type="checkbox" name="Questao2" id="q2">
                <label for="q2">alguma pergunta 2</label>
              </div>

              <div class="w-full py-7">
                <input type="checkbox" name="Questao3" id="q3">
                <label for="q3">alguma pergunta 3</label>
              </div>

              <div class="w-full">
                <input type="checkbox" name="Questao4" id="q4">
                <label for="q4">alguma pergunta 4</label>
              </div>

              <div class="w-full">
                <input type="checkbox" name="Questao5" id="q5">
                <label for="q5">alguma pergunta 5</label>
              </div>

            <div class="col-span-3 w-full">
                <label class="block uppercase tracking-wide text-gray-700 text-xs font-bold mb-2" for="adc1">observação complementa</label>

              <textarea name="complemento" id="adc1" class="block w-full min-w-0 box-border resize-y rounded border border-gray-300 bg-slate-100 p-3 text-gray-700" rows="3"></textarea>

            </div>
          </div>


        </form>

        <footer class="flex justify-end  max-w-150 mx-auto bg-white py-4 px-11 rounded-lg  shadow-lg">

          <button class="bg-green-500 rounded px-2 py-1 hover:bg-green-700  border-emerald-600 hover:border-green-900" type="button">proximo</button>

        </footer>
</body>
</html>
